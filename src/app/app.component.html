<!-- nav -->
@if (user) {
  <nav class="navbar navbar-expand navbar-dark bg-dark px-3">
    <div class="navbar-nav">
      <a
        class="nav-item nav-link"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
        >
        <a class="nav-item nav-link" routerLink="/users" routerLinkActive="active"
          >Users</a
          >
          <button class="btn btn-link nav-item nav-link" (click)="logout()">
            Logout
          </button>
        </div>
      </nav>
    }

    <!-- main app container -->
    <div class="app-container" [class.bg-light]="user">
      <alert />
      <router-outlet />
    </div>

    <!-- credits -->
    <div class="text-center mt-4">
      <p>
        <a href="https://angular.dev" target="_top"
          >Angular 14 - User Registration and Login Example & Tutorial</a
          >
        </p>
      </div>
